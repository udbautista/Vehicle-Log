<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Garage Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE7DA;
    --paper-dark:#E1DAC6;
    --card:#F5F1E6;
    --ink:#28261F;
    --ink-soft:#6B6455;
    --line:#C9BFA4;
    --blue:#3A5A6E;
    --blue-dim:#3A5A6E22;
    --red:#B23A22;
    --red-dim:#B23A2216;
    --amber:#B27A22;
    --amber-dim:#B27A2216;
    --green:#4B6B3F;
    --green-dim:#4B6B3F16;
    --gray-dim:#6B645516;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #F2EEE1 0%, var(--paper) 55%),
      repeating-linear-gradient(0deg, transparent, transparent 27px, #00000006 27px, #00000006 28px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--ink); color:var(--paper);
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 0 var(--blue);
  }
  header .brand{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.06em;
    font-size:19px; text-transform:uppercase; display:flex; align-items:center; gap:8px;
  }
  header .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block;}
  header button.icon{
    background:none;border:1px solid #ffffff33;color:var(--paper);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.05em;
    padding:6px 10px; border-radius:6px; cursor:pointer;
  }
  header button.icon:active{background:#ffffff1a;}

  main{padding:16px 16px 40px;}

  /* ---------- Section labels ---------- */
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-soft); margin:22px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow:first-child{margin-top:2px;}
  .eyebrow::after{content:'';flex:1;height:1px;background:var(--line);}

  /* ---------- Vehicle tag cards ---------- */
  .tag{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    margin-bottom:12px;
    position:relative;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .tag:active{transform:scale(0.985);}
  .tag::before{
    content:'';
    position:absolute; left:16px; top:-6px;
    width:12px;height:12px;border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .tag-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .tag-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; text-transform:uppercase; letter-spacing:.02em;}
  .tag-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .tag-odo{
    font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700;
    text-align:right; letter-spacing:.02em;
  }
  .tag-odo-label{font-size:9px; letter-spacing:.1em; color:var(--ink-soft); text-align:right; text-transform:uppercase; margin-top:1px;}
  .tag-bottom{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}

  .stamp{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.08em;
    padding:4px 8px; border-radius:4px; border:1.5px solid currentColor;
    display:inline-block;
  }
  .stamp.overdue{color:var(--red); background:var(--red-dim);}
  .stamp.duesoon{color:var(--amber); background:var(--amber-dim);}
  .stamp.ok{color:var(--green); background:var(--green-dim);}
  .stamp.none{color:var(--ink-soft); background:var(--gray-dim); border-style:dashed;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase;
    padding:11px 16px; border-radius:8px; border:1.5px solid var(--ink);
    background:var(--ink); color:var(--paper);
    cursor:pointer; text-align:center;
  }
  .btn:active{opacity:.8;}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn.block{display:block; width:100%; margin-top:14px;}
  .btn.blue{border-color:var(--blue); background:var(--blue); color:#fff;}

  /* ---------- Back row ---------- */
  .backrow{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .backrow button{
    background:none;border:none;font-family:'JetBrains Mono',monospace;
    font-size:12px; color:var(--blue); cursor:pointer; padding:6px 0; letter-spacing:.04em;
  }

  .vhead{margin:8px 0 4px;}
  .vhead h1{font-family:'Oswald',sans-serif; font-size:28px; text-transform:uppercase; margin:0; letter-spacing:.01em;}
  .vhead .meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .odo-edit{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-top:14px;
  }
  .odo-edit label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .odo-edit input{
    font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700;
    border:none; background:transparent; text-align:right; width:110px; color:var(--ink);
  }
  .odo-edit input:focus{outline:none;}

  /* ---------- Schedule / due list ---------- */
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px;
  }
  .item-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .item-title{font-weight:600; font-size:14px;}
  .item-notes{font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.4;}
  .item-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); margin-top:8px; font-family:'JetBrains Mono',monospace;}

  /* ---------- History log entries ---------- */
  .logentry{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px; position:relative;
  }
  .logentry .top{display:flex; justify-content:space-between; align-items:baseline;}
  .logentry .date{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--blue); font-weight:700;}
  .logentry .miles{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .logentry .type{font-weight:600; font-size:14.5px; margin-top:4px;}
  .logentry .details{font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.4;}
  .logentry .bottom{display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .logentry .del{background:none;border:none;color:var(--red); font-size:10px; font-family:'JetBrains Mono',monospace; cursor:pointer; text-transform:uppercase; letter-spacing:.06em;}
  .item .del{background:none;border:1px solid var(--line); color:var(--red); border-radius:6px; cursor:pointer;}

  .empty{
    text-align:center; padding:30px 14px; color:var(--ink-soft); font-size:13px;
    border:1.5px dashed var(--line); border-radius:var(--radius); background:var(--card);
  }

  /* ---------- Modal form ---------- */
  .overlay{
    position:fixed; inset:0; background:#00000055; z-index:40;
    display:flex; align-items:flex-end;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:480px; margin:0 auto;
    border-radius:16px 16px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    box-shadow:0 -4px 24px #00000030;
  }
  .sheet h2{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:20px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:52px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:1.5px solid var(--blue);}
  .sheetbtns{display:flex; gap:10px; margin-top:16px;}
  .sheetbtns .btn{flex:1;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-family:'JetBrains Mono',monospace;
    font-size:12px; padding:10px 18px; border-radius:20px; z-index:60;
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .toast.show{opacity:1;}

  .attn-count{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px;
    color:var(--red); background:var(--red-dim); border:1px solid var(--red);
    border-radius:20px; padding:2px 9px; letter-spacing:.02em;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= DATA MODEL ================= */
const DEFAULT_VEHICLES = [
  {id:'kia', name:'Kia Forte GT', year:2023, model:'Forte GT (Manual)', notes:'Manual transmission, turbo engine'},
  {id:'gl1000', name:'Honda GL1000', year:1978, model:'Gold Wing', notes:'Aircooled flat-4, shaft drive, points ignition, 4 carbs'},
  {id:'cb350', name:'Honda CB350', year:1968, model:'CB350', notes:'Aircooled twin, chain drive, electronic ignition'},
];

const DEFAULT_SCHEDULE = [
  {v:'kia', type:'Oil & Filter Change', miles:7500, months:12, notes:'Full synthetic, turbo engine'},
  {v:'kia', type:'Tire Rotation', miles:7500, months:12, notes:''},
  {v:'kia', type:'Cabin Air Filter', miles:15000, months:12, notes:''},
  {v:'kia', type:'Engine Air Filter', miles:30000, months:24, notes:''},
  {v:'kia', type:'Brake Fluid Flush', miles:30000, months:24, notes:''},
  {v:'kia', type:'Spark Plugs', miles:30000, months:null, notes:'Iridium, turbocharged engine'},
  {v:'kia', type:'Manual Transmission Fluid', miles:60000, months:null, notes:''},
  {v:'kia', type:'Drive Belt Inspection', miles:60000, months:null, notes:''},
  {v:'kia', type:'Coolant Flush', miles:60000, months:60, notes:''},
  {v:'kia', type:'Fuel System Inspection', miles:30000, months:null, notes:'Tank, filter, lines'},

  {v:'gl1000', type:'Engine Oil & Filter', miles:2000, months:6, notes:''},
  {v:'gl1000', type:'Valve Clearance Adjustment', miles:4000, months:12, notes:'8 valves'},
  {v:'gl1000', type:'Carburetor Sync', miles:4000, months:12, notes:'4 carbs'},
  {v:'gl1000', type:'Ignition Points & Timing', miles:4000, months:12, notes:''},
  {v:'gl1000', type:'Spark Plugs', miles:4000, months:12, notes:''},
  {v:'gl1000', type:'Final Drive Gear Oil', miles:4000, months:12, notes:'Shaft drive'},
  {v:'gl1000', type:'Front Fork Oil', miles:12000, months:24, notes:''},
  {v:'gl1000', type:'Brake Fluid Flush', miles:null, months:12, notes:''},
  {v:'gl1000', type:'Fuel Petcock / Lines Inspection', miles:null, months:12, notes:'Ethanol degrades old rubber/gaskets'},
  {v:'gl1000', type:'Battery Check', miles:null, months:6, notes:''},
  {v:'gl1000', type:'Tires (age replacement)', miles:null, months:60, notes:'Replace by age regardless of tread on old bikes'},

  {v:'cb350', type:'Engine Oil & Filter', miles:1500, months:6, notes:''},
  {v:'cb350', type:'Valve Clearance Adjustment', miles:1500, months:6, notes:''},
  {v:'cb350', type:'Carburetor Sync', miles:3000, months:12, notes:'2 carbs'},
  {v:'cb350', type:'Ignition Timing Check (Electronic)', miles:6000, months:24, notes:'No points to file/gap — verify timing & advance curve, check wiring/connectors'},
  {v:'cb350', type:'Spark Plugs', miles:3000, months:12, notes:''},
  {v:'cb350', type:'Drive Chain Adjustment / Lube', miles:500, months:null, notes:'Chain drive'},
  {v:'cb350', type:'Brake System Inspection', miles:null, months:12, notes:'Drum brakes both ends'},
  {v:'cb350', type:'Fuel Petcock / Lines Inspection', miles:null, months:12, notes:'Ethanol degrades old rubber/gaskets'},
  {v:'cb350', type:'Battery Check', miles:null, months:6, notes:''},
  {v:'cb350', type:'Tires (age replacement)', miles:null, months:60, notes:'Replace by age regardless of tread on old bikes'},
];

const DEFAULT_MILEAGE = {kia:40000, gl1000:33000, cb350:4000};
const DEFAULT_LOG = [
  {id:'e1', v:'kia', date:'2026-06-15', miles:38500, type:'Oil & Filter Change', details:'5W-30 full synthetic, OEM filter', cost:65, by:'DIY'},
  {id:'e2', v:'gl1000', date:'2025-09-01', miles:32000, type:'Valve Clearance Adjustment', details:'All 8 valves checked, 2 adjusted', cost:0, by:'DIY'},
  {id:'e3', v:'cb350', date:'2024-05-20', miles:3850, type:'Carburetor Sync', details:'Synced w/ mercury sticks, idle set 1000rpm', cost:40, by:'DIY'},
];

function freshDefaultState(){
  return {
    vehicles: JSON.parse(JSON.stringify(DEFAULT_VEHICLES)),
    schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
    mileage: {...DEFAULT_MILEAGE},
    log: JSON.parse(JSON.stringify(DEFAULT_LOG)),
  };
}

/* ================= STATE ================= */
let state = freshDefaultState();
let view = {screen:'dashboard', vehicle:null, tab:'due'};
let formOpen = false;
let backupOpen = false;
let addVehicleOpen = false;
let addItemOpen = false;
let editVehicleId = null;
let editItemType = null;
let importScheduleOpen = false;

/* ================= STORAGE (browser localStorage — persists on this device/browser) ================= */
async function loadData(){
  try{
    const raw = localStorage.getItem('garage-log-app-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state = {
        vehicles: parsed.vehicles || JSON.parse(JSON.stringify(DEFAULT_VEHICLES)),
        schedule: parsed.schedule || JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
        mileage: parsed.mileage || {...DEFAULT_MILEAGE},
        log: parsed.log || JSON.parse(JSON.stringify(DEFAULT_LOG)),
      };
      await saveData();
    }
    else { await saveData(); }
  }catch(e){ console.error('load failed', e); }
  render();
}
async function saveData(){
  try{ localStorage.setItem('garage-log-app-data', JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ================= LOGIC ================= */
function addMonths(dateStr, months){
  const d = new Date(dateStr+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return d;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = (typeof d==='string') ? new Date(d+'T00:00:00') : d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function computeStatus(vId, item, currentMileage){
  const entries = state.log.filter(e=>e.v===vId && e.type===item.type);
  if(entries.length===0){
    return {status:'none', lastDate:null, lastMiles:null, nextMiles:null, nextDate:null, milesRemaining:null};
  }
  entries.sort((a,b)=> new Date(b.date)-new Date(a.date));
  const last = entries[0];
  const nextMiles = item.miles ? last.miles + item.miles : null;
  const nextDate = item.months ? addMonths(last.date, item.months) : null;
  const milesRemaining = (nextMiles!=null) ? nextMiles - currentMileage : null;
  const today = new Date();
  let status = 'ok';
  const overdueByMiles = nextMiles!=null && currentMileage >= nextMiles;
  const overdueByDate = nextDate!=null && today >= nextDate;
  if(overdueByMiles || overdueByDate){ status='overdue'; }
  else{
    const dueSoonMiles = milesRemaining!=null && milesRemaining<=500 && milesRemaining>0;
    const daysRemaining = nextDate!=null ? (nextDate-today)/86400000 : null;
    const dueSoonDate = daysRemaining!=null && daysRemaining<=30 && daysRemaining>0;
    if(dueSoonMiles || dueSoonDate){ status='duesoon'; }
  }
  return {status, lastDate:last.date, lastMiles:last.miles, nextMiles, nextDate, milesRemaining};
}
function vehicleSummary(vId){
  const mileage = state.mileage[vId];
  const items = state.schedule.filter(s=>s.v===vId).map(s=>({...s, calc:computeStatus(vId,s,mileage)}));
  const overdue = items.filter(i=>i.calc.status==='overdue').length;
  const dueSoon = items.filter(i=>i.calc.status==='duesoon').length;
  let overall = 'ok';
  if(overdue>0) overall='overdue'; else if(dueSoon>0) overall='duesoon';
  return {items, overdue, dueSoon, overall, mileage};
}
function totalAttention(){
  return state.vehicles.reduce((sum,v)=>{
    const s = vehicleSummary(v.id);
    return sum + s.overdue + s.dueSoon;
  },0);
}

/* ================= RENDER ================= */
function statusLabel(s){
  return {overdue:'Overdue', duesoon:'Due Soon', ok:'OK', none:'No History'}[s];
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderHeader());
  const main = document.createElement('main');
  if(view.screen==='dashboard') main.appendChild(renderDashboard());
  else if(view.screen==='vehicle') main.appendChild(renderVehicle());
  app.appendChild(main);
  if(formOpen) app.appendChild(renderForm());
  if(backupOpen) app.appendChild(renderBackupModal());
  if(addVehicleOpen) app.appendChild(renderAddVehicleModal());
  if(addItemOpen) app.appendChild(renderAddItemModal());
  if(editVehicleId) app.appendChild(renderEditVehicleModal());
  if(editItemType) app.appendChild(renderEditItemModal());
  if(importScheduleOpen) app.appendChild(renderImportScheduleModal());
}

function renderHeader(){
  const h = document.createElement('header');
  const attn = totalAttention();
  h.innerHTML = `
    <div class="brand"><span class="dot"></span>Garage Log</div>
    <div style="display:flex; gap:8px; align-items:center;">
      ${view.screen==='dashboard' && attn>0 ? `<span class="attn-count">${attn} DUE</span>` : ''}
      ${view.screen==='dashboard' ? `<button class="icon" id="backupBtn">BACKUP</button>` : ''}
    </div>
  `;
  const backupBtn = h.querySelector('#backupBtn');
  if(backupBtn) backupBtn.onclick = ()=>{ backupOpen = true; render(); };
  return h;
}

function renderDashboard(){
  const wrap = document.createElement('div');
  const eyebrow = el(`<div class="eyebrow">Your Fleet</div>`);
  wrap.appendChild(eyebrow);
  state.vehicles.forEach(v=>{
    const s = vehicleSummary(v.id);
    const tag = el(`
      <div class="tag" data-v="${v.id}">
        <div class="tag-top">
          <div>
            <div class="tag-name">${v.name}</div>
            <div class="tag-sub">${v.year} · ${v.model}</div>
          </div>
          <div>
            <div class="tag-odo">${s.mileage.toLocaleString()}</div>
            <div class="tag-odo-label">miles</div>
          </div>
        </div>
        <div class="tag-bottom">
          <span class="stamp ${s.overall}">${statusLabel(s.overall)}</span>
          ${s.overdue>0 ? `<span class="stamp overdue">${s.overdue} OVERDUE</span>` : ''}
          ${s.dueSoon>0 ? `<span class="stamp duesoon">${s.dueSoon} SOON</span>` : ''}
        </div>
      </div>
    `);
    tag.onclick = ()=>{ view = {screen:'vehicle', vehicle:v.id, tab:'due'}; render(); };
    wrap.appendChild(tag);
  });

  const addTag = el(`
    <div class="tag" style="border-style:dashed; display:flex; align-items:center; justify-content:center; min-height:64px;">
      <span style="font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:.06em; font-size:13px; color:var(--ink-soft);">+ ADD VEHICLE</span>
    </div>
  `);
  addTag.onclick = ()=>{ addVehicleOpen = true; render(); };
  wrap.appendChild(addTag);

  return wrap;
}

function renderVehicle(){
  const v = state.vehicles.find(x=>x.id===view.vehicle);
  const s = vehicleSummary(v.id);
  const wrap = document.createElement('div');

  const back = el(`<div class="backrow" style="justify-content:space-between;"><button id="backBtn">&larr; ALL VEHICLES</button><button id="removeVBtn" style="color:var(--red);">REMOVE VEHICLE</button></div>`);
  back.querySelector('#backBtn').onclick = ()=>{ view={screen:'dashboard'}; render(); };
  back.querySelector('#removeVBtn').onclick = async ()=>{
    if(confirm(`Remove ${v.name}? This deletes its mileage, schedule, and full service history. This cannot be undone.`)){
      state.vehicles = state.vehicles.filter(x=>x.id!==v.id);
      state.schedule = state.schedule.filter(x=>x.v!==v.id);
      state.log = state.log.filter(x=>x.v!==v.id);
      delete state.mileage[v.id];
      await saveData();
      toast(`${v.name} removed`);
      view = {screen:'dashboard'};
      render();
    }
  };
  wrap.appendChild(back);

  const head = el(`
    <div class="vhead" style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
      <div>
        <h1>${v.name}</h1>
        <div class="meta">${v.year||''}${v.year&&v.model?' · ':''}${v.model||''}${v.notes?' — '+v.notes:''}</div>
      </div>
      <button class="icon" id="editVBtn" style="color:var(--ink); border-color:var(--line); flex-shrink:0; margin-top:4px;">EDIT</button>
    </div>
  `);
  head.querySelector('#editVBtn').onclick = ()=>{ editVehicleId = v.id; render(); };
  wrap.appendChild(head);

  const odo = el(`
    <div class="odo-edit">
      <label>Current Mileage</label>
      <input type="number" id="mileageInput" value="${s.mileage}" inputmode="numeric">
    </div>
  `);
  const mInput = odo.querySelector('input');
  mInput.onchange = async ()=>{
    const val = parseInt(mInput.value,10);
    if(!isNaN(val) && val>=0){ state.mileage[v.id]=val; await saveData(); render(); }
  };
  wrap.appendChild(odo);

  // tabs
  const tabs = el(`
    <div class="eyebrow" style="margin-top:22px; cursor:pointer;">
      <span id="tabDue" style="${view.tab==='due'?'color:var(--ink);font-weight:700;':''}">Due List</span>
      &nbsp;/&nbsp;
      <span id="tabHist" style="${view.tab==='history'?'color:var(--ink);font-weight:700;':''}">History (${state.log.filter(e=>e.v===v.id).length})</span>
    </div>
  `);
  tabs.querySelector('#tabDue').onclick = ()=>{ view.tab='due'; render(); };
  tabs.querySelector('#tabHist').onclick = ()=>{ view.tab='history'; render(); };
  wrap.appendChild(tabs);

  if(view.tab==='due'){
    const order = {overdue:0, duesoon:1, none:2, ok:3};
    const sorted = [...s.items].sort((a,b)=> order[a.calc.status]-order[b.calc.status]);
    if(sorted.length===0){
      wrap.appendChild(el(`<div class="empty">No service items yet. Add one below to start tracking due dates for this vehicle.</div>`));
    }
    sorted.forEach(item=>{
      const c = item.calc;
      const dueMilesTxt = c.nextMiles!=null ? c.nextMiles.toLocaleString()+' mi' : '—';
      const dueDateTxt = c.nextDate ? fmtDate(c.nextDate) : '—';
      const remTxt = c.milesRemaining!=null ? (c.milesRemaining>=0 ? c.milesRemaining.toLocaleString()+' mi left' : Math.abs(c.milesRemaining).toLocaleString()+' mi over') : '';
      const row = el(`
        <div class="item">
          <div class="item-top">
            <div class="item-title">${item.type}</div>
            <div style="display:flex; gap:6px; align-items:center;">
              <span class="stamp ${c.status}">${statusLabel(c.status)}</span>
              <button class="del" data-type="${item.type}" title="Remove item" style="font-size:14px; line-height:1; padding:2px 4px;">&times;</button>
            </div>
          </div>
          ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ''}
          <div class="item-row"><span>Next: ${dueMilesTxt}</span><span>${dueDateTxt}</span></div>
          ${remTxt ? `<div class="item-row"><span>${remTxt}</span><span>${c.lastDate? 'Last: '+fmtDate(c.lastDate):''}</span></div>` : ''}
        </div>
      `);
      row.querySelector('.del').onclick = async (ev)=>{
        ev.stopPropagation();
        if(confirm(`Remove "${item.type}" from the schedule? (Past log entries stay in History.)`)){
          state.schedule = state.schedule.filter(x=>!(x.v===v.id && x.type===item.type));
          await saveData(); toast('Item removed'); render();
        }
      };
      row.style.cursor = 'pointer';
      row.onclick = ()=>{ editItemType = item.type; render(); };
      wrap.appendChild(row);
    });
    const btnRow = el(`<div style="display:flex; gap:8px; margin-top:4px;"></div>`);
    const addItemBtn = el(`<button class="btn ghost" style="flex:1;">+ Add Item</button>`);
    addItemBtn.onclick = (ev)=>{ ev.stopPropagation(); addItemOpen = true; render(); };
    const importBtn = el(`<button class="btn ghost" style="flex:1;">Import Schedule</button>`);
    importBtn.onclick = (ev)=>{ ev.stopPropagation(); importScheduleOpen = true; render(); };
    btnRow.appendChild(addItemBtn);
    btnRow.appendChild(importBtn);
    wrap.appendChild(btnRow);
  } else {
    const entries = state.log.filter(e=>e.v===v.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(entries.length===0){
      wrap.appendChild(el(`<div class="empty">No service logged yet for this vehicle.</div>`));
    } else {
      entries.forEach(e=>{
        const row = el(`
          <div class="logentry">
            <div class="top"><span class="date">${fmtDate(e.date)}</span><span class="miles">${e.miles.toLocaleString()} mi</span></div>
            <div class="type">${e.type}</div>
            ${e.details ? `<div class="details">${e.details}</div>` : ''}
            <div class="bottom">
              <span>${e.by||'—'}${e.cost?' · $'+e.cost:''}</span>
              <button class="del" data-id="${e.id}">Delete</button>
            </div>
          </div>
        `);
        row.querySelector('.del').onclick = async ()=>{
          if(confirm('Delete this log entry?')){
            state.log = state.log.filter(x=>x.id!==e.id);
            await saveData(); toast('Entry deleted'); render();
          }
        };
        wrap.appendChild(row);
      });
    }
  }

  const addBtn = el(`<button class="btn block blue">+ Log Service</button>`);
  addBtn.onclick = ()=>{ formOpen = true; render(); };
  wrap.appendChild(addBtn);

  return wrap;
}

function slugify(name){
  let base = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'vehicle';
  let id = base, n = 1;
  while(state.vehicles.some(v=>v.id===id)){ id = `${base}-${++n}`; }
  return id;
}

function renderImportScheduleModal(){
  const v = state.vehicles.find(x=>x.id===view.vehicle);
  const overlay = el(`<div class="overlay"></div>`);
  overlay.onclick = (ev)=>{ if(ev.target===overlay){ importScheduleOpen=false; render(); } };

  const example = JSON.stringify([
    {type:"Oil & Filter Change", miles:3000, months:6, notes:"Optional notes"},
    {type:"Coolant Flush", miles:null, months:24, notes:""}
  ], null, 2);

  const sheet = el(`
    <div class="sheet">
      <h2>Import Schedule — ${v.name}</h2>
      <div class="field">
        <label>Paste a schedule as JSON (array of items). Matching Service Types update in place; new ones are added.</label>
        <textarea id="impText" style="min-height:140px; font-family:'JetBrains Mono',monospace; font-size:11px;" placeholder='${example}'></textarea>
      </div>
      <div class="sheetbtns">
        <button class="btn ghost" id="impCancel">Cancel</button>
        <button class="btn" id="impSave">Import</button>
      </div>
    </div>
  `);
  sheet.querySelector('#impCancel').onclick = ()=>{ importScheduleOpen=false; render(); };
  sheet.querySelector('#impSave').onclick = async ()=>{
    const text = sheet.querySelector('#impText').value.trim();
    if(!text){ toast('Paste schedule JSON first'); return; }
    let parsed;
    try{ parsed = JSON.parse(text); if(!Array.isArray(parsed)) throw new Error('not array'); }
    catch(e){ toast('That doesn\'t look like valid schedule JSON'); return; }
    let added=0, updated=0;
    parsed.forEach(raw=>{
      if(!raw.type) return;
      const miles = (raw.miles===undefined || raw.miles===null || raw.miles==='') ? null : parseInt(raw.miles,10);
      const months = (raw.months===undefined || raw.months===null || raw.months==='') ? null : parseInt(raw.months,10);
      if(miles==null && months==null) return;
      const notes = raw.notes || '';
      const existing = state.schedule.find(x=>x.v===v.id && x.type===raw.type);
      if(existing){ existing.miles=miles; existing.months=months; existing.notes=notes; updated++; }
      else{ state.schedule.push({v:v.id, type:raw.type, miles, months, notes}); added++; }
    });
    await saveData();
    importScheduleOpen = false;
    toast(`Imported: ${added} added, ${updated} updated`);
    render();
  };
  overlay.appendChild(sheet);
  return overlay;
}

function renderBackupModal(){
  const overlay = el(`<div class="overlay"></div>`);
  overlay.onclick = (ev)=>{ if(ev.target===overlay){ backupOpen=false; render(); } };

  const json = JSON.stringify(state, null, 2);
  const dateStamp = new Date().toISOString().slice(0,10);

  const sheet = el(`
    <div class="sheet">
      <h2>Backup &amp; Restore</h2>
      <div class="field">
        <label>Your Data (log + mileage) — save this somewhere safe</label>
        <textarea id="bkText" style="min-height:120px; font-family:'JetBrains Mono',monospace; font-size:11px;" readonly>${json}</textarea>
      </div>
      <div class="sheetbtns">
        <button class="btn ghost" id="bkCopy">Copy</button>
        <button class="btn" id="bkDownload">Download File</button>
      </div>

      <div class="eyebrow" style="margin-top:24px;">Restore From Backup</div>
      <div class="field">
        <label>Paste backup text here</label>
        <textarea id="bkRestoreText" style="min-height:90px; font-family:'JetBrains Mono',monospace; font-size:11px;" placeholder="Paste previously-saved backup JSON..."></textarea>
      </div>
      <button class="btn ghost block" id="bkRestore">Restore This Backup</button>

      <div class="eyebrow" style="margin-top:24px; color:var(--red);">Danger Zone</div>
      <button class="btn ghost block" id="bkReset" style="border-color:var(--red); color:var(--red);">Reset to Example Data</button>

      <button class="btn block" id="bkClose" style="margin-top:18px;">Done</button>
    </div>
  `);

  sheet.querySelector('#bkCopy').onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(json);
      toast('Copied to clipboard');
    }catch(e){
      sheet.querySelector('#bkText').select();
      toast('Select & copy manually');
    }
  };
  sheet.querySelector('#bkDownload').onclick = ()=>{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `garage-log-backup-${dateStamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Download started');
  };
  sheet.querySelector('#bkRestore').onclick = async ()=>{
    const text = sheet.querySelector('#bkRestoreText').value.trim();
    if(!text){ toast('Paste backup text first'); return; }
    try{
      const parsed = JSON.parse(text);
      if(!parsed.mileage || !parsed.log) throw new Error('bad shape');
      if(confirm('Replace all current data with this backup? This cannot be undone.')){
        state = parsed;
        await saveData();
        backupOpen = false;
        toast('Backup restored');
        render();
      }
    }catch(e){
      toast('That doesn\'t look like a valid backup');
    }
  };
  sheet.querySelector('#bkReset').onclick = async ()=>{
    if(confirm('Reset all data back to the example set? This clears your logged history.')){
      state = freshDefaultState();
      await saveData();
      backupOpen = false;
      toast('Data reset');
      render();
    }
  };
  sheet.querySelector('#bkClose').onclick = ()=>{ backupOpen=false; render(); };

  overlay.appendChild(sheet);
  return overlay;
}

function renderForm(){
  const v = state.vehicles.find(x=>x.id===view.vehicle);
  const types = state.schedule.filter(s=>s.v===v.id).map(s=>s.type);
  const overlay = el(`<div class="overlay"></div>`);
  overlay.onclick = (ev)=>{ if(ev.target===overlay){ formOpen=false; render(); } };

  const today = new Date().toISOString().slice(0,10);
  const sheet = el(`
    <div class="sheet">
      <h2>Log Service — ${v.name}</h2>
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${today}"></div>
      <div class="field"><label>Service Type</label>
        <select id="fType">
          ${types.map(t=>`<option value="${t}">${t}</option>`).join('')}
          <option value="__other__">Other (type below)</option>
        </select>
      </div>
      <div class="field" id="fOtherWrap" style="display:none;"><label>Custom Service Type</label><input type="text" id="fOther" placeholder="e.g. Chain replacement"></div>
      <div class="field"><label>Mileage</label><input type="number" id="fMiles" value="${state.mileage[v.id]}" inputmode="numeric"></div>
      <div class="field"><label>Details / Parts</label><textarea id="fDetails" placeholder="Notes, parts used..."></textarea></div>
      <div class="field"><label>Cost ($)</label><input type="number" id="fCost" value="0" inputmode="decimal"></div>
      <div class="field"><label>Performed By</label><input type="text" id="fBy" value="DIY"></div>
      <div class="sheetbtns">
        <button class="btn ghost" id="fCancel">Cancel</button>
        <button class="btn" id="fSave">Save Entry</button>
      </div>
    </div>
  `);
  sheet.querySelector('#fType').onchange = (ev)=>{
    sheet.querySelector('#fOtherWrap').style.display = ev.target.value==='__other__' ? 'block' : 'none';
  };
  sheet.querySelector('#fCancel').onclick = ()=>{ formOpen=false; render(); };
  sheet.querySelector('#fSave').onclick = async ()=>{
    const typeSel = sheet.querySelector('#fType').value;
    const type = typeSel==='__other__' ? (sheet.querySelector('#fOther').value.trim()||'Other') : typeSel;
    const date = sheet.querySelector('#fDate').value || today;
    const miles = parseInt(sheet.querySelector('#fMiles').value,10) || 0;
    const details = sheet.querySelector('#fDetails').value.trim();
    const cost = parseFloat(sheet.querySelector('#fCost').value) || 0;
    const by = sheet.querySelector('#fBy').value.trim() || 'DIY';
    const entry = {id:'e'+Date.now(), v:v.id, date, miles, type, details, cost, by};
    state.log.push(entry);
    if(miles > (state.mileage[v.id]||0)) state.mileage[v.id] = miles;
    await saveData();
    formOpen = false;
    toast('Service logged');
    render();
  };
  overlay.appendChild(sheet);
  return overlay;
}
